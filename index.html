<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>PUREGOLD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;600&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css"></head><body>
<div id="app">
<div id="view-main">
  <header class="top">
    <div class="brand"><b>PURE</b>GOLD<small>by PureFxAi</small></div>
    <div class="hb">
      <button type="button" id="ref" class="icon-btn" title="Refresh">⟳</button>
    </div>
  </header>
  <div id="offlineBanner" class="banner hidden"></div>
  <div id="upd" class="meta"></div>

  <main id="panels">
    <!-- HOME -->
    <div class="panel" data-panel="home">
      <section class="hero" id="setupHero">
        <div class="skel" data-i="load"></div>
      </section>
      <section>
        <h2 data-i="world"></h2>
        <div id="xau"><div class="skel" data-i="load"></div></div>
      </section>
      <section>
        <h2 data-i="thai"></h2>
        <div id="tg" class="grid"></div>
        <div id="tgSrc" class="mut s"></div>
      </section>
      <section>
        <h2 data-i="bias"></h2>
        <div id="bias"><div class="skel" data-i="load"></div></div>
      </section>
      <section>
        <h2 data-i="fc"></h2>
        <div id="fc"><div class="skel" data-i="load"></div></div>
      </section>
    </div>

    <!-- CHART -->
    <div class="panel hidden" data-panel="chart">
      <section>
        <div class="sec-head">
          <h2 data-i="chart"></h2>
          <label class="tog"><input type="checkbox" id="smcToggle"><span data-i="smc"></span></label>
        </div>
        <div class="tf" id="tf"></div>
        <div id="chart" class="chart"></div>
        <div id="chartNote" class="mut s"></div>
      </section>
      <section>
        <h2 data-i="sr"></h2>
        <div id="sr"><div class="skel" data-i="load"></div></div>
      </section>
      <section>
        <h2 data-i="smcList"></h2>
        <div id="smcNote" class="mut s"></div>
        <div id="smcList"><div class="skel" data-i="load"></div></div>
      </section>
      <section>
        <h2 data-i="plan"></h2>
        <div id="plan"><div class="skel" data-i="load"></div></div>
      </section>
    </div>


    <!-- TECHNIQUES -->
    <div class="panel hidden" data-panel="tech">
      <section>
        <h2 data-i="techMenu"></h2>
        <div class="mut s" data-i="techWorld" style="margin-top:-4px;margin-bottom:10px"></div>
        <div id="techPick" class="chip-row tech-chips"></div>
      </section>
      <section id="techDetail">
        <div class="skel" data-i="load"></div>
      </section>
    </div>

    <!-- NEWS -->
    <div class="panel hidden" data-panel="news">
      <section>
        <h2 data-i="news"></h2>
        <div id="newsList"><div class="skel" data-i="load"></div></div>
      </section>
    </div>

    <!-- MORE -->
    <div class="panel hidden" data-panel="more">
      <section>
        <h2 data-i="langPick"></h2>
        <div id="langPick" class="chip-row"></div>
      </section>
      <section>
        <h2 data-i="set"></h2>
        <div id="set"></div>
      </section>
      <section>
        <h2 data-i="priceAlerts"></h2>
        <div id="priceAlerts"></div>
      </section>
      <section>
        <h2 data-i="alertHist"></h2>
        <div id="alertHist" class="mut s"></div>
      </section>
      <section>
        <h2 data-i="don"></h2>
        <div id="don"></div>
      </section>
      <section>
        <h2 data-i="sign"></h2>
        <div id="signTeaser"></div>
      </section>
      <section class="about">
        <h2 data-i="about"></h2>
        <div class="mut s" id="aboutVer"></div>
        <footer id="disc"></footer>
      </section>
    </div>
  </main>

  <nav class="bnav" id="bnav">
    <button type="button" data-tab="home" class="on"><span class="ni">⌂</span><span data-i="navHome"></span></button>
    <button type="button" data-tab="chart"><span class="ni">▣</span><span data-i="navChart"></span></button>
    <button type="button" data-tab="tech"><span class="ni">◆</span><span data-i="navTech"></span></button>
    <button type="button" data-tab="news"><span class="ni">☰</span><span data-i="navNews"></span></button>
    <button type="button" data-tab="more"><span class="ni">⋯</span><span data-i="navMore"></span></button>
  </nav>
</div>

<div id="view-signup" class="hidden">
  <header class="top">
    <div class="brand"><b>PURE</b>GOLD<small data-i="signSub">EXNESS</small></div>
    <div class="hb"><button type="button" id="backMain">←</button></div>
  </header>
  <div class="prog"><div id="bar"></div></div>
  <div class="pl"><span id="pt"></span><span id="pc"></span></div>
  <div class="dots" id="dots"></div>
  <div id="stage"></div>
  <div class="disc" id="signDisc"></div>
  <p class="mut s pad"><a id="webGuide" href="#"></a></p>
</div>
</div>
<script type="module" src="/src/main.js"></script>
</body></html>
